name: Weekly health check

on:
  schedule:
    # Mondays 13:17 UTC. Off the hour so it is not delayed by the :00 rush.
    - cron: '17 13 * * 1'
  workflow_dispatch:

# contents: write is needed to store the sitemap baseline on the health-state
# branch. That weekly commit also counts as repository activity, which keeps
# GitHub from disabling this schedule after 60 idle days on a public repo.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore last sitemap count from the health-state branch
        run: |
          mkdir -p .health
          if git fetch --quiet origin health-state 2>/dev/null; then
            git show origin/health-state:sitemap-count > .health/sitemap-count || true
          fi
          echo "previous: $(cat .health/sitemap-count 2>/dev/null || echo none)"

      - name: Run checks
        run: node scripts/health-check.mjs

      - name: Store sitemap count on the health-state branch
        if: always()
        env:
          GIT_AUTHOR_NAME: health-check
          GIT_AUTHOR_EMAIL: health-check@users.noreply.github.com
          GIT_COMMITTER_NAME: health-check
          GIT_COMMITTER_EMAIL: health-check@users.noreply.github.com
        run: |
          [ -s .health/sitemap-count ] || { echo "no count to store"; exit 0; }
          count=$(cat .health/sitemap-count)
          parent=$(git rev-parse -q --verify origin/health-state || true)
          if [ -n "$parent" ] && [ "$(git show origin/health-state:sitemap-count 2>/dev/null || true)" = "$count" ] && [ "$(( ( $(date +%s) - $(git log -1 --format=%ct origin/health-state) ) / 86400 ))" -lt 30 ]; then
            echo "baseline unchanged and recent; nothing to commit"; exit 0
          fi
          blob=$(git hash-object -w .health/sitemap-count)
          tree=$(printf '100644 blob %s\tsitemap-count\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "health: sitemap count $count")
          git push --quiet origin "$commit:refs/heads/health-state"
          echo "stored $count"

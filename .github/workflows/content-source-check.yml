name: Monthly content source review
on:
  schedule:
    - cron: '23 13 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:check-sources
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-source-review
          path: |
            .content-reports/source-check.json
            .content-reports/source-check.csv
            .content-reports/summary.md
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
